<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Thorly — ecosistema de herramientas de inteligencia artificial</title>
  <desc id="d">Thorly IA, ImaThorly, Mind by Thorly, bots de WhatsApp y pool de IA. Una sola cuenta para web, escritorio y WhatsApp.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a8cdb"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#4a8cdb" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#4a8cdb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="400" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="#0d0d0f"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#glowA)"/>
    <rect width="1280" height="400" fill="url(#glowB)"/>

    <!-- Órbitas decorativas -->
    <g fill="none" stroke="url(#brand)" stroke-opacity="0.35">
      <circle cx="1075" cy="170" r="150" stroke-width="1"/>
      <circle cx="1075" cy="170" r="108" stroke-width="1" stroke-dasharray="3 7"/>
      <circle cx="1075" cy="170" r="66" stroke-width="1"/>
    </g>
    <circle cx="1075" cy="170" r="30" fill="url(#brand)" fill-opacity="0.9"/>
    <circle cx="1075" cy="170" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
    <g fill="#ffffff">
      <circle cx="1225" cy="170" r="6" fill="#d946ef"/>
      <circle cx="999" cy="64" r="5" fill="#4a8cdb"/>
      <circle cx="1019" cy="236" r="4" fill="#8b5cf6"/>
      <circle cx="1150" cy="246" r="5" fill="#d946ef" fill-opacity="0.8"/>
    </g>

    <!-- Logo -->
    <circle cx="150" cy="160" r="68" fill="none" stroke="url(#brand)" stroke-opacity="0.55" stroke-width="2"/>
    <g transform="translate(150 160) scale(0.6) translate(-100 -100)">
      <circle cx="100" cy="100" r="95" fill="#ffffff"/>
      <rect x="75" y="50" width="15" height="125" rx="8" fill="#000000" transform="rotate(25 100 100)"/>
      <rect x="110" y="25" width="15" height="125" rx="8" fill="#000000" transform="rotate(25 100 100)"/>
    </g>

    <!-- Título -->
    <text x="265" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="url(#brand)" letter-spacing="-2">Thorly</text>
    <text x="268" y="222" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#e5e7eb">Ecosistema de herramientas de inteligencia artificial</text>
    <text x="268" y="254" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#9ca3af" letter-spacing="0.4">Una sola cuenta  ·  Web  ·  Escritorio  ·  WhatsApp  ·  Hecho en Venezuela</text>

    <!-- Productos -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e5e7eb" text-anchor="middle">
      <rect x="64"  y="322" width="130" height="38" rx="19" fill="#d946ef" fill-opacity="0.08" stroke="#d946ef" stroke-opacity="0.45"/>
      <text x="129" y="346">Thorly IA</text>
      <rect x="206" y="322" width="130" height="38" rx="19" fill="#d946ef" fill-opacity="0.08" stroke="#d946ef" stroke-opacity="0.45"/>
      <text x="271" y="346">ImaThorly</text>
      <rect x="348" y="322" width="168" height="38" rx="19" fill="#d946ef" fill-opacity="0.08" stroke="#d946ef" stroke-opacity="0.45"/>
      <text x="432" y="346">Mind by Thorly</text>
      <rect x="528" y="322" width="188" height="38" rx="19" fill="#d946ef" fill-opacity="0.08" stroke="#d946ef" stroke-opacity="0.45"/>
      <text x="622" y="346">Bots de WhatsApp</text>
      <rect x="728" y="322" width="130" height="38" rx="19" fill="#4a8cdb" fill-opacity="0.08" stroke="#4a8cdb" stroke-opacity="0.5"/>
      <text x="793" y="346">Pool de IA</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
